<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b2b"><title>The Crepery ERP Secure Trial</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#203333;font-family:Cairo,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:20px}.card{background:white;border:1px solid #e6e1d7;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #152b2b0b}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:12px}.muted{color:#697b78;font-size:14px}h1{font-size:22px;margin:0}h2{font-size:18px;margin-top:0}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:13px;border:1px solid #d8ded9;border-radius:11px;font:inherit;background:white}button{border:0;border-radius:11px;padding:12px 18px;background:#a8422c;color:white;font:700 15px Cairo;cursor:pointer}button.secondary{background:#203b3a}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{border:1px solid #e1e7e2;padding:8px;border-radius:9px;font-size:13px}.check input{width:auto}.hidden{display:none}.user{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:12px;background:#e8f1ed;padding:4px 8px;border-radius:30px}@media(max-width:560px){.wrap{padding:12px}.grid,.checks{grid-template-columns:1fr}.card{padding:15px}.user{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="brand"><img src="/static/logo.png"><div><h1>THE CREPERY ERP</h1><div class="muted">Secure trial · إدارة الحسابات والصلاحيات</div></div></header><section id="setup" class="card hidden"><h2>إنشاء حساب المالك لأول مرة</h2><p class="muted">أدخل مفتاح التهيئة الذي تضبطه في Render، ثم أنشئ كلمة مرور قوية. لا توجد كلمة مرور افتراضية.</p><label>مفتاح التهيئة</label><input id="setupkey" type="password"><label>اسم المستخدم</label><input id="owneruser" value="owner"><label>الاسم الظاهر</label><input id="ownername" value="System Owner"><label>كلمة المرور (12 حرفًا على الأقل)</label><input id="ownerpass" type="password"><button onclick="setupOwner()">إنشاء حساب Owner</button></section><section id="login" class="card hidden"><h2>تسجيل الدخول</h2><label>اسم المستخدم أو الرقم الوظيفي</label><input id="username" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">دخول</button></section><section id="panel" class="hidden"><div class="card"><div class="user"><div><b id="who"></b><div class="muted">لوحة إدارة المستخدمين</div></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></div></div><div class="card"><h2>إضافة مستخدم</h2><div class="grid"><div><label>اسم المستخدم / الرقم</label><input id="newuser"></div><div><label>الاسم</label><input id="newname"></div><div><label>كلمة المرور المؤقتة</label><input id="newpass" type="password" placeholder="12 حرفًا على الأقل"></div><div><label>نطاق البيانات</label><select id="scope"><option value="all">كل الفروع</option><option value="shatby">الشاطبي فقط</option><option value="saba_pasha">سابا باشا فقط</option><option value="warehouse">المخزن فقط</option></select></div></div><h2 style="margin-top:20px">الصلاحيات المستقلة</h2><div id="permissions" class="checks"></div><button onclick="createUser()">إنشاء المستخدم</button></div><div class="card"><h2>المستخدمون الحاليون</h2><div id="users" class="muted">تحميل...</div></div><div class="card"><h2>سجل النشاط</h2><div id="audit" class="muted"></div></div></section><div id="msg" class="muted"></div></main><script>
const modules={dashboard:'لوحة التحكم',inventory:'المخزون',count:'الجرد',receiving:'الاستلام',issuing:'الصرف',transfers:'التحويلات',consumption:'الاستهلاك',sales:'المبيعات',purchases:'المشتريات',employees:'الموظفون',payroll:'المرتبات',expenses:'المصروفات',pl:'P&L',recipes:'الرسبي',users:'إدارة المستخدمين',settings:'الإعدادات'};const actions={view:'مشاهدة',create:'إضافة',edit:'تعديل',delete:'حذف',approve:'اعتماد',print:'طباعة',export:'تصدير'};let isOwner=false;async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}function msg(t){document.getElementById('msg').textContent=t}async function start(){let s=await api('/api/setup-status');if(!s.owner_exists){show('setup');return}try{let me=await api('/api/me');show('panel');document.getElementById('who').textContent=me.name+' ('+me.username+')';isOwner=me.owner;await loadUsers();await loadAudit()}catch{show('login')}}function show(id){['setup','login','panel'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}async function setupOwner(){try{await api('/api/setup-owner','POST',{setup_key:setupkey.value,username:owneruser.value,display_name:ownername.value,password:ownerpass.value});msg('تم إنشاء المالك. سجل الدخول الآن.');show('login')}catch(e){msg(e.message)}}async function login(){try{await api('/api/login','POST',{username:username.value,password:password.value});start()}catch(e){msg(e.message)}}async function logout(){await api('/api/logout','POST',{});show('login')}function buildChecks(){let h='';for(let [m,n] of Object.entries(modules)){for(let [a,an] of Object.entries(actions)){h+=`<label class="check"><input type="checkbox" data-m="${m}" data-a="${a}"> ${n} – ${an}</label>`}}document.getElementById('permissions').innerHTML=h}function collectPerms(){let p={};document.querySelectorAll('#permissions input:checked').forEach(x=>{p[x.dataset.m]??={};p[x.dataset.m][x.dataset.a]=true});return p}async function createUser(){try{await api('/api/users','POST',{username:newuser.value,display_name:newname.value,password:newpass.value,scope:scope.value,permissions:collectPerms()});msg('تم إنشاء الحساب');await loadUsers()}catch(e){msg(e.message)}}async function loadUsers(){try{let d=await api('/api/users');users.innerHTML=d.users.map(u=>`<div class="user"><div><b>${esc(u.display_name)}</b> <span class="tag">${esc(u.username)}</span><div class="muted">${esc(u.scope)} · ${u.active?'نشط':'موقوف'}</div></div>${u.is_owner?'Owner':`<button class="secondary" onclick="toggleUser(${u.id},${!u.active})">${u.active?'إيقاف':'تفعيل'}</button>`}</div>`).join('')||'لا يوجد مستخدمون'}catch(e){users.textContent=e.message}}async function toggleUser(id,active){try{await api('/api/users/'+id,'PATCH',{active});loadUsers()}catch(e){msg(e.message)}}async function loadAudit(){try{let d=await api('/api/audit');audit.innerHTML=d.entries.map(x=>`<div class="user"><span>${esc(x.username)} – ${esc(x.action)} ${esc(x.detail||'')}</span><small>${esc(x.created_at)}</small></div>`).join('')}catch(e){audit.textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}buildChecks();start();
</script></body></html>
